<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miljam's Wedding Photo Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #fcf8f5;
            --card-bg: #f4ece4;
            --text-color: #5a381d;
            --accent-color: #8c6239;
            --border-color: #e6d7cc;
            --white: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .autumn-btn {
            background-color: var(--accent-color);
            color: var(--white);
            transition: opacity 0.2s;
        }
        .autumn-btn:hover {
            opacity: 0.9;
        }
        .sage-btn {
            background-color: #6b7b6e;
            color: #ffffff;
            transition: opacity 0.2s;
        }
        .sage-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Top Centered Header / Hero Banner with Autumn Floral Background -->
    <header class="relative bg-cover bg-center border-b border-[#e6d7cc] px-6 py-12 text-center shadow-sm" style="background-image: url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=80');">
        <!-- Semi-transparent overlay to ensure text readability -->
        <div class="absolute inset-0 bg-[#fcf8f5]/90 backdrop-blur-[2px]"></div>

        <div class="relative max-w-3xl mx-auto flex flex-col items-center z-10">
            <div class="text-3xl mb-1">💍💍</div>
            <h1 class="text-2xl sm:text-3xl font-bold text-[#8c6239]">Miljam's Wedding Photo Upload</h1>
            <p class="text-sm text-[#5a381d]/80 mt-1">Thanks for visiting!</p>
            
            <div class="mt-5">
                <button onclick="openUploadModal()" class="autumn-btn font-medium px-6 py-2.5 rounded-full text-sm shadow-md cursor-pointer">
                    + Upload Photos/Videos
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Action & Selection Bar -->
        <div class="bg-[#f4ece4] border border-[#e6d7cc] rounded-lg p-4 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-sm">
            <div class="flex items-center space-x-4">
                <span id="selection-count" class="text-sm font-medium text-[#5a381d]">0 items selected</span>
                <button onclick="toggleSelectAll()" id="select-all-btn" class="text-xs font-semibold px-3 py-1.5 bg-white border border-[#e6d7cc] rounded-md text-[#5a381d] hover:bg-[#e6d7cc]/30 transition">
                    Select All
                </button>
            </div>
            <button id="zip-btn" onclick="downloadSelectedZip()" disabled class="bg-[#5a381d] text-white text-sm font-medium px-4 py-2 rounded-lg disabled:bg-gray-300 disabled:cursor-not-allowed transition">
                Download Selected as ZIP (.zip)
            </button>
        </div>

        <!-- Media Grid -->
        <div id="media-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamically populated cards -->
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl relative border border-[#e6d7cc] overflow-hidden flex flex-col max-h-[90vh]">
            
            <div class="overflow-y-auto p-6 text-center">
                <!-- Couple Photo -->
                <div class="mb-4">
                    <img src="/static/couple.jpg" alt="Jamie & Millie" class="w-full h-48 object-cover rounded-xl shadow-inner border border-[#e6d7cc]">
                </div>

                <!-- Title & Subtitle -->
                <h2 class="text-2xl font-bold mb-1 text-[#8c6239]">Miljam's Wedding Photo Upload</h2>
                <p class="text-sm text-[#5a381d]/80 mb-5">Thanks for visiting!</p>

                <!-- Notice Box -->
                <div class="border border-[#e6d7cc] bg-[#fcf8f5] rounded-xl p-3 text-xs text-[#5a381d] mb-5 shadow-sm">
                    Videos may take a few moments to process after uploading.<br>Please do not refresh!
                </div>

                <!-- Name Input -->
                <input type="text" id="uploader-name" placeholder="Your Name / Family (Optional)" class="w-full border border-[#e6d7cc] rounded-full px-4 py-3 mb-4 text-sm bg-[#fcf8f5] text-[#5a381d] focus:ring-2 focus:ring-[#8c6239] outline-none text-center shadow-inner">

                <!-- Custom File Picker -->
                <div class="mb-6 flex flex-col items-center">
                    <input type="file" id="file-input" multiple accept="image/*,video/*" class="hidden" onchange="handleFileSelection()">
                    
                    <label id="choose-files-label" for="file-input" class="sage-btn font-medium w-full py-3 rounded-full text-sm shadow-md cursor-pointer text-center block transition-all">
                        Choose files
                    </label>
                    <span id="file-chosen-text" class="text-xs text-[#5a381d]/80 mt-2 text-center">No file chosen</span>
                </div>

                <!-- Upload Progress Bar (Hidden initially) -->
                <div id="progress-container" class="mb-5 hidden">
                    <div class="flex justify-between text-xs font-semibold text-[#8c6239] mb-1">
                        <span id="progress-text">Uploading... 0%</span>
                    </div>
                    <div class="w-full bg-[#f4ece4] rounded-full h-3 overflow-hidden border border-[#e6d7cc]">
                        <div id="progress-bar" class="sage-btn h-full w-0 transition-all duration-200"></div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col gap-2">
                    <button id="submit-upload-btn" onclick="submitUploads()" disabled class="bg-gray-300 text-gray-500 font-medium w-full py-3 rounded-full text-sm cursor-not-allowed transition-all">
                        Upload Photos/Videos
                    </button>
                    <button onclick="closeUploadModal()" class="w-full py-2.5 rounded-full text-sm font-medium text-[#5a381d] hover:bg-gray-100 transition cursor-pointer">
                        Cancel / Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" onclick="closeLightbox(event)" class="fixed inset-0 bg-black/85 z-[999999] hidden flex items-center justify-center p-4">
        <button class="absolute top-5 right-5 bg-neutral-800 text-white border-2 border-white rounded-full w-11 h-11 text-xl font-bold flex items-center justify-center cursor-pointer z-[1000000]" onclick="closeLightbox(event, true)">✕</button>
        <div class="relative max-w-[90vw] max-h-[90vh] flex flex-col items-center justify-center" id="lightbox-content-wrapper">
            <div id="lightbox-media-container" class="max-w-[90vw] max-h-[80vh] flex items-center justify-center"></div>
            <button id="lightbox-delete-btn" class="mt-4 bg-red-600 text-white px-4 py-2 rounded-full font-bold text-sm hidden cursor-pointer shadow-lg" onclick="deleteCurrentLightboxItem()">🗑️ Delete</button>
        </div>
    </div>

    <script>
        let mediaItems = [];
        let selectedIds = new Set();
        let currentLightboxId = null;

        function getMyUploads() {
            return JSON.parse(localStorage.getItem('my_wedding_uploads') || '[]');
        }
        function addMyUpload(id) {
            const uploads = getMyUploads();
            if (!uploads.includes(id)) {
                uploads.push(id);
                localStorage.setItem('my_wedding_uploads', JSON.stringify(uploads));
            }
        }
        function removeMyUpload(id) {
            let uploads = getMyUploads();
            uploads = uploads.filter(item => item !== id);
            localStorage.setItem('my_wedding_uploads', JSON.stringify(uploads));
        }

        function getMyLikes() {
            return JSON.parse(localStorage.getItem('my_wedding_likes') || '[]');
        }
        function toggleMyLikeStorage(id) {
            let likes = getMyLikes();
            if (likes.includes(id)) {
                likes = likes.filter(item => item !== id);
                localStorage.setItem('my_wedding_likes', JSON.stringify(likes));
                return false;
            } else {
                likes.push(id);
                localStorage.setItem('my_wedding_likes', JSON.stringify(likes));
                return true;
            }
        }

        async function fetchMedia() {
            const res = await fetch('/api/media');
            mediaItems = await res.json();
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('media-grid');
            grid.innerHTML = '';

            if (mediaItems.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-[#8c6239] py-12">No memories uploaded yet. Be the first to add some!</p>`;
                return;
            }

            const myUploads = getMyUploads();
            const myLikes = getMyLikes();

            mediaItems.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-[#f4ece4] border border-[#e6d7cc] rounded-xl overflow-hidden shadow-sm flex flex-col justify-between relative group";
                
                const isSelected = selectedIds.has(item.id);
                const isLikedByMe = myLikes.includes(item.id);
                const isMyUpload = myUploads.includes(item.id);

                let previewHTML = '';
                if (item.is_video) {
                    previewHTML = `
                        <div onclick="openLightbox('${item.id}', true)" class="w-full h-48 bg-black flex items-center justify-center cursor-pointer relative">
                            <video src="${item.url}" class="w-full h-48 object-cover pointer-events-none"></video>
                            <span class="absolute bg-black/60 text-white rounded-full p-2 text-xs font-bold">▶ Video</span>
                        </div>`;
                } else {
                    previewHTML = `<img src="${item.url}" alt="${item.filename}" onclick="openLightbox('${item.id}', false)" class="w-full h-48 object-cover cursor-pointer">`;
                }

                card.innerHTML = `
                    <div class="relative">
                        <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${item.id}')" class="absolute top-3 left-3 w-4 h-4 rounded text-[#8c6239] focus:ring-[#8c6239] cursor-pointer z-10 accent-[#8c6239]">
                        ${previewHTML}
                    </div>
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs text-[#8c6239]">By: ${item.uploader}</span>
                            <button onclick="toggleLike('${item.id}')" class="flex items-center space-x-1 text-xs px-2.5 py-1 rounded-full transition ${isLikedByMe ? 'bg-red-500 text-white' : 'bg-white text-[#5a381d] border border-[#e6d7cc]'}">
                                <span>❤️</span>
                                <span class="font-semibold">${item.likes}</span>
                            </button>
                        </div>
                        <div class="flex justify-between items-center text-xs font-medium border-t border-[#e6d7cc] pt-3">
                            <a href="${item.url}" target="_blank" class="text-[#8c6239] hover:underline">View Original</a>
                            ${isMyUpload ? `<button onclick="deleteItem('${item.id}')" class="text-gray-500 hover:text-red-600 transition">Delete</button>` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            updateActionBar();
        }

        function toggleSelect(id) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
            } else {
                selectedIds.add(id);
            }
            updateActionBar();
        }

        function toggleSelectAll() {
            const selectAllBtn = document.getElementById('select-all-btn');
            if (selectedIds.size === mediaItems.length) {
                selectedIds.clear();
                selectAllBtn.innerText = "Select All";
            } else {
                mediaItems.forEach(item => selectedIds.add(item.id));
                selectAllBtn.innerText = "Deselect All";
            }
            renderGrid();
        }

        function updateActionBar() {
            document.getElementById('selection-count').innerText = `${selectedIds.size} items selected`;
            document.getElementById('zip-btn').disabled = selectedIds.size === 0;
            const selectAllBtn = document.getElementById('select-all-btn');
            if (mediaItems.length > 0 && selectedIds.size === mediaItems.length) {
                selectAllBtn.innerText = "Deselect All";
            } else {
                selectAllBtn.innerText = "Select All";
            }
        }

        function openUploadModal() { 
            document.getElementById('upload-modal').classList.remove('hidden'); 
        }

        function closeUploadModal() { 
            document.getElementById('upload-modal').classList.add('hidden');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('progress-bar').style.width = '0%';
            
            // Reset file picker & button states
            document.getElementById('file-input').value = '';
            document.getElementById('file-chosen-text').innerText = "No file chosen";
            
            const chooseFilesLabel = document.getElementById('choose-files-label');
            chooseFilesLabel.classList.remove('autumn-btn');
            chooseFilesLabel.classList.add('sage-btn');

            const submitBtn = document.getElementById('submit-upload-btn');
            submitBtn.disabled = true;
            submitBtn.classList.remove('sage-btn', 'shadow-md', 'cursor-pointer');
            submitBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
        }

        function handleFileSelection() {
            const fileInput = document.getElementById('file-input');
            const fileChosenText = document.getElementById('file-chosen-text');
            const chooseFilesLabel = document.getElementById('choose-files-label');
            const submitBtn = document.getElementById('submit-upload-btn');

            if (fileInput.files.length > 0) {
                if (fileInput.files.length === 1) {
                    fileChosenText.innerText = fileInput.files[0].name;
                } else {
                    fileChosenText.innerText = `${fileInput.files.length} files selected`;
                }
                
                // Choose files button becomes orange
                chooseFilesLabel.classList.remove('sage-btn');
                chooseFilesLabel.classList.add('autumn-btn');

                // Submit button becomes active green
                submitBtn.disabled = false;
                submitBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                submitBtn.classList.add('sage-btn', 'shadow-md', 'cursor-pointer');
            } else {
                fileChosenText.innerText = "No file chosen";
                
                // Choose files button is green
                chooseFilesLabel.classList.remove('autumn-btn');
                chooseFilesLabel.classList.add('sage-btn');

                // Submit button is greyed out
                submitBtn.disabled = true;
                submitBtn.classList.remove('sage-btn', 'shadow-md', 'cursor-pointer');
                submitBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
            }
        }

        function submitUploads() {
            const filesInput = document.getElementById('file-input');
            const files = filesInput.files;
            const uploader = document.getElementById('uploader-name').value || "Guest";
            if (files.length === 0) return;

            const formData = new FormData();
            for (let file of files) formData.append('files', file);
            formData.append('uploader', uploader);

            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const submitBtn = document.getElementById('submit-upload-btn');

            progressContainer.classList.remove('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload', true);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percentComplete = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percentComplete + '%';
                    progressText.innerText = `Uploading... ${percentComplete}%`;
                }
            };

            xhr.onload = function() {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    data.items.forEach(item => addMyUpload(item.id));
                    closeUploadModal();
                    fetchMedia();
                } else {
                    alert("Upload failed. Please try again.");
                }
            };

            xhr.onerror = function() {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                alert("An error occurred during upload.");
            };

            xhr.send(formData);
        }

        async function toggleLike(id) {
            const likedByMe = toggleMyLikeStorage(id);
            const action = likedByMe ? "like" : "unlike";
            const res = await fetch(`/api/like/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action })
            });
            if (res.ok) {
                fetchMedia();
            }
        }

        async function deleteItem(id) {
            if (confirm("Are you sure you want to delete this memory?")) {
                const res = await fetch(`/api/media/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    removeMyUpload(id);
                    selectedIds.delete(id);
                    closeLightbox(null, true);
                    fetchMedia();
                }
            }
        }

        function openLightbox(id, isVideo) {
            currentLightboxId = id;
            const item = mediaItems.find(i => i.id === id);
            if (!item) return;

            const container = document.getElementById('lightbox-media-container');
            container.innerHTML = '';

            if (isVideo) {
                const video = document.createElement('video');
                video.src = item.url;
                video.controls = true;
                video.className = "max-w-[90vw] max-h-[80vh] rounded-lg shadow-2xl object-contain";
                container.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.src = item.url;
                img.className = "max-w-[90vw] max-h-[80vh] rounded-lg shadow-2xl object-contain";
                container.appendChild(img);
            }

            const myUploads = getMyUploads();
            const delBtn = document.getElementById('lightbox-delete-btn');
            if (myUploads.includes(id)) {
                delBtn.style.display = 'block';
            } else {
                delBtn.style.display = 'none';
            }

            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox(e, force = false) {
            if (force || e.target === document.getElementById('lightbox')) {
                document.getElementById('lightbox').classList.add('hidden');
                document.getElementById('lightbox-media-container').innerHTML = '';
                currentLightboxId = null;
            }
        }

        function deleteCurrentLightboxItem() {
            if (currentLightboxId) {
                deleteItem(currentLightboxId);
            }
        }

        async function downloadSelectedZip() {
            const res = await fetch('/api/download-zip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file_ids: Array.from(selectedIds) })
            });
            const data = await res.json();
            if (data.download_url) {
                window.location.href = data.download_url;
            }
        }

        fetchMedia();
    </script>
</body>
</html>
